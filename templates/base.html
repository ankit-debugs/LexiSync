<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LexiSync{% endblock %}</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 400: "#a78bfa", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9" }
          }
        }
      }
    }
  </script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .pill-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); }
    .pill-ok   { background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.3);  }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .3s ease forwards; }
    /* scrollbar */
    ::-webkit-scrollbar { width:4px } ::-webkit-scrollbar-track { background:transparent }
    ::-webkit-scrollbar-thumb { background:#4b5563; border-radius:2px }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full text-gray-100 font-sans antialiased">

  <!-- Nav -->
  <nav class="glass fixed top-0 inset-x-0 z-50 flex items-center justify-between px-6 py-3">
    <a href="{% url 'rooms:lobby' %}" class="flex items-center gap-2 text-brand-400 font-bold text-lg tracking-tight">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
      </svg>
      LexiSync
    </a>
    {% if user.is_authenticated %}
    <div class="flex items-center gap-4 text-sm">
      <span class="text-gray-400">Hi, <span class="text-white font-medium">{{ user.username }}</span></span>
      <a href="{% url 'accounts:logout' %}" class="text-gray-400 hover:text-red-400 transition-colors">Sign out</a>
    </div>
    {% endif %}
  </nav>

  <main class="pt-16 min-h-full">
    {% if messages %}
    <div class="fixed top-20 right-4 z-50 space-y-2">
      {% for message in messages %}
      <div class="glass rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}text-red-400{% else %}text-green-400{% endif %} fade-in">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
