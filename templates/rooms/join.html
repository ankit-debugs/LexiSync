{% extends "base.html" %}
{% block title %}Join Room — LexiSync{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold text-white text-center mb-6">Join a Session</h1>
    <div class="glass rounded-2xl p-8">
      {% if error %}
      <p class="text-red-400 text-sm text-center mb-4 pill-error rounded-lg px-4 py-2">{{ error }}</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input
          type="text"
          name="code"
          placeholder="Enter 8-char room code"
          maxlength="8"
          autofocus
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition mb-4 uppercase tracking-widest text-center text-lg font-mono"
        />
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">
          Enter Room
        </button>
      </form>
      <p class="text-center mt-4"><a href="{% url 'rooms:lobby' %}" class="text-gray-500 hover:text-gray-300 text-sm transition">← Back to lobby</a></p>
    </div>
  </div>
</div>
{% endblock %}
